name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  CONFIG_REPO_URL: https://github.com/mmc1987/Openwrt_etc
  CONFIG_REPO_BRANCH: main
  CONFIG_REPO_PATH: backup-OpenWrt
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  # 固件里烧着 Openwrt_etc 注入的 WireGuard/ZeroTier/DDNS/PPPoE 凭据，
  # 所以 release 以草稿形式发布：只有你和协作者可见可下载，公开访客看不到。
  # 仓库保持 public 是有意的——公开仓库的 Actions 分钟数与产物存储不计费。
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk genisoimage gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load private files overlay
      env:
        CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN || secrets.ACTIONS_TRIGGER_PAT }}
      run: |
        if [ -z "$CONFIG_REPO_TOKEN" ]; then
          echo "::warning::CONFIG_REPO_TOKEN or ACTIONS_TRIGGER_PAT is not set. Skipping private files overlay."
          exit 0
        fi
        if ! git clone --depth 1 -b "$CONFIG_REPO_BRANCH" "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/mmc1987/Openwrt_etc.git" private-config 2>/dev/null; then
          echo "::error::克隆 $CONFIG_REPO_URL 失败：token 无效、过期或对私有仓库无读权限"
          exit 1
        fi
        # Prefer the firmware source tree at repo root (etc/); fall back to the
        # router snapshot under $CONFIG_REPO_PATH/etc/ for legacy layouts.
        if [ -d "private-config/etc" ]; then
          SRC="private-config/etc"
        elif [ -n "$CONFIG_REPO_PATH" ] && [ -d "private-config/$CONFIG_REPO_PATH/etc" ]; then
          SRC="private-config/$CONFIG_REPO_PATH/etc"
        else
          echo "::error::$CONFIG_REPO_URL 里既没有 etc/ 也没有 $CONFIG_REPO_PATH/etc/"
          rm -rf private-config
          exit 1
        fi
        echo "Using overlay source: $SRC"
        mkdir -p openwrt/files/etc
        rsync -a --exclude='.git' --exclude='.DS_Store' "$SRC/" openwrt/files/etc/
        rm -rf private-config

    - name: Load custom configuration
      run: |
        # 私有 overlay 已经建好 openwrt/files；这里必须合并而不是 mv，
        # 否则 mv 会把仓库里的 files/ 塞成 openwrt/files/files/
        [ -e files ] && rsync -a files/ openwrt/files/
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        cp .config .config.seed
        make defconfig
        echo "=== defconfig 对 .config 的改动（上游改名/删包会静默丢包，看这里）==="
        diff -a .config.seed .config | grep -E '^[<>] CONFIG_PACKAGE_' || true
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        firmware_dirs=(openwrt/bin/targets/*/*)
        if [ ! -d "${firmware_dirs[0]}" ]; then
          echo "No firmware directory found under openwrt/bin/targets" >&2
          exit 1
        fi
        cd "${firmware_dirs[0]}"
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        {
          echo "Source: $REPO_URL ($REPO_BRANCH)"
          echo "Runner: $ImageVersion"
          ls -1 "$FIRMWARE"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        draft: true
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 7
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
